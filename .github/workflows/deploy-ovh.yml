name: Deploy to NSI Monétique

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, intl, pdo_mysql
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader --no-scripts

      - name: Install and build frontend
        run: npm ci && npm run build

      - name: Create deployment archive
        run: |
            tar --exclude='.env*' \
              --exclude='.git' \
              --exclude='node_modules' \
              --exclude='storage/app/public' \
              --exclude='public/storage' \
              --exclude='public/index.php' \
              -czf "$RUNNER_TEMP/deploy.tar.gz" .
            cp "$RUNNER_TEMP/deploy.tar.gz" deploy.tar.gz

      - name: Upload deployment archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USERNAME }}
          port: ${{ secrets.OVH_SSH_PORT || 22 }}
          key: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          source: deploy.tar.gz
          target: /homez.380/nsimonetml/nordsud-app

      - name: Extract and activate deployment
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USERNAME }}
          port: ${{ secrets.OVH_SSH_PORT || 22 }}
          key: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          script: |
            set -eu
            cd /homez.380/nsimonetml/nordsud-app
            tar -xzf deploy.tar.gz --overwrite
            rm -f deploy.tar.gz
            cp public/.htaccess /homez.380/nsimonetml/www/.htaccess
            cp -R public/build /homez.380/nsimonetml/www/
            cp -R public/css /homez.380/nsimonetml/www/
            cp -R public/fonts /homez.380/nsimonetml/www/
            cp -R public/images /homez.380/nsimonetml/www/
            cp -R public/js /homez.380/nsimonetml/www/
            mkdir -p /homez.380/nsimonetml/www/livewire-5346a406
            cp vendor/livewire/livewire/dist/livewire.min.js /homez.380/nsimonetml/www/livewire-5346a406/livewire.min.js
            test -f .env
            test -f vendor/autoload.php
            test -f /homez.380/nsimonetml/www/index.php
            test -d /homez.380/nsimonetml/www/storage
            test -f /homez.380/nsimonetml/www/build/manifest.json
            test -f /homez.380/nsimonetml/www/js/filament/filament/app.js
            test -f /homez.380/nsimonetml/www/livewire-5346a406/livewire.min.js

      - name: Verify live site
        run: curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 https://www.nsi-monetique.com/ --output /dev/null
